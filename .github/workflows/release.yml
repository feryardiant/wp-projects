name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    name: Publish
    uses: projek-xyz/actions/.github/workflows/release.yml@main

    permissions:
      contents: write

  upload:
    name: Upload
    needs: publish
    uses: projek-xyz/actions/.github/workflows/uploads.yml@main
    with:
      workflow_name: Tests

    permissions:
      contents: write
